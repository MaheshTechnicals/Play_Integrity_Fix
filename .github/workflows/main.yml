name: Update PIF JSON on New Release

on:
  workflow_dispatch: # Allows manual triggering for the first run
  schedule:
    # Run this workflow every 6 hours
    - cron: '0 */6 * * *'

jobs:
  delete_previous_runs:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Get all previous workflow runs (handle pagination)
      - name: Get all previous workflow runs
        id: get_runs
        run: |
          PAGE=1
          RUNS=""
          while :; do
            RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.MY_GITHUB_TOKEN }}" \
              "https://api.github.com/repos/MaheshTechnicals/Play_Integrity_Fix/actions/runs?per_page=100&page=$PAGE")
            RUN_COUNT=$(echo "$RESPONSE" | jq -r '.workflow_runs | length')
            if [ "$RUN_COUNT" -eq 0 ]; then
              break
            fi
            RUNS=$(echo "$RESPONSE" | jq -r '.workflow_runs[] | .id')
            PAGE=$((PAGE + 1))
          done
          echo "Runs to delete: $RUNS"
          echo "::set-output name=runs::$RUNS"

      # Step 2: Delete all previous workflow runs
      - name: Delete all previous workflow runs
        run: |
          RUNS="${{ steps.get_runs.outputs.runs }}"
          echo "Deleting the following runs: $RUNS"
          for RUN_ID in $RUNS; do
            curl -X DELETE -H "Authorization: token ${{ secrets.MY_GITHUB_TOKEN }}" \
              "https://api.github.com/repos/MaheshTechnicals/Play_Integrity_Fix/actions/runs/$RUN_ID"
            echo "Deleted workflow run with ID: $RUN_ID"

  download_extract_upload:
    runs-on: ubuntu-latest
    needs: delete_previous_runs

    steps:
      # Step 3: Check out your repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 4: Get the latest release info from PlayIntegrityFix repository
      - name: Get PlayIntegrityFix latest release info
        id: get_latest_release
        run: |
          RELEASE_DATA=$(curl -s https://api.github.com/repos/chiteroman/PlayIntegrityFix/releases/latest)
          RELEASE_URL=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name | endswith(".zip")).browser_download_url')
          RELEASE_TAG=$(echo "$RELEASE_DATA" | jq -r '.tag_name')
          echo "Latest release tag: $RELEASE_TAG"
          echo "::set-output name=release_tag::$RELEASE_TAG"
          echo "::set-output name=release_url::$RELEASE_URL"

      # Step 5: Delete all existing releases
      - name: Delete all existing releases
        run: |
          RELEASES=$(curl -s -H "Authorization: token ${{ secrets.MY_GITHUB_TOKEN }}" \
            https://api.github.com/repos/MaheshTechnicals/Play_Integrity_Fix/releases)
          
          echo "Deleting existing releases..."
          for RELEASE_ID in $(echo "$RELEASES" | jq -r '.[].id'); do
            curl -X DELETE -H "Authorization: token ${{ secrets.MY_GITHUB_TOKEN }}" \
              https://api.github.com/repos/MaheshTechnicals/Play_Integrity_Fix/releases/$RELEASE_ID
            echo "Deleted release with ID: $RELEASE_ID"
          done

      # Step 6: Download the latest PlayIntegrityFix release
      - name: Download latest PlayIntegrityFix release
        run: |
          curl -L "${{ steps.get_latest_release.outputs.release_url }}" --output PlayIntegrityFix.zip

      # Step 7: Extract the zip file and get pif.json
      - name: Extract pif.json from the zip
        run: |
          unzip PlayIntegrityFix.zip
          if [ -f "pif.json" ]; then
            echo "pif.json found!"
          else
            echo "pif.json not found!" && exit 1
          fi

      # Step 8: Read MODEL value from pif.json
      - name: Read MODEL value
        id: read_model
        run: |
          MODEL=$(jq -r '.MODEL' pif.json)
          echo "MODEL value: $MODEL"
          echo "::set-output name=model::$MODEL"

      # Step 9: Generate a valid and unique tag name for your release
      - name: Generate tag name
        id: generate_tag
        run: |
          TAG_NAME="v$(date +'%Y%m%d-%H%M%S')"
          echo "Generated tag name: $TAG_NAME"
          echo "::set-output name=tag::$TAG_NAME"

      # Step 10: Create a new release with PlayIntegrityFix tag mentioned in the description
      - name: Create new release with pif.json
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.generate_tag.outputs.tag }}  # Use the generated tag
          release_name: "${{ steps.get_latest_release.outputs.release_tag }}"
          body: "pif.json update (${{ steps.read_model.outputs.model }} spoofing)"
          draft: false
          prerelease: false

      # Step 11: Upload pif.json to the newly created release
      - name: Upload pif.json to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./pif.json
          asset_name: pif.json
          asset_content_type: application/json
